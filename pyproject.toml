[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "africa-whisper"
version = "0.1.0"
description = "Universal Multilingual Speech Recognition for 314 African Languages using Whisper Large-v3-Turbo"
authors = [{ name = "AfriSpeech" }]
license = { text = "CC-BY-NC-4.0" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "datasets>=2.18.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
]

[project.urls]
Homepage = "https://github.com/AfriSpeech/africa-whisper"
Models = "https://huggingface.co/AfriSpeech/africa-whisper-checkpoints"
Datasets = "https://huggingface.co/datasets/AfriSpeech/afri2universal"
